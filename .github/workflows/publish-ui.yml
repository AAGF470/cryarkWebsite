name: Publish @aagf470/ui

# Publishes the shared component library to GitHub Packages.
# Trigger it either by publishing a GitHub Release, or manually from the
# Actions tab ("Run workflow"). Uses the built-in GITHUB_TOKEN — no PAT needed.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN publish to GitHub Packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aagf470'

      - name: Install dependencies
        run: npm install

      - name: Build the library
        run: npm run build:ui

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: shared
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
